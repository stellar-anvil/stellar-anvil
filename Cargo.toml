[workspace]
members = [
    "crates/anvil-core",
    "crates/anvil-profiler",
    "crates/anvil-multi",
    "crates/anvil-auth",
    "crates/anvil-cli",
    "examples/counter",
    "examples/multi_contract",
    "examples/defi_vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellar-anvil-io/stellar-anvil"
authors = ["Stellar Anvil Contributors"]

[workspace.dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
indicatif = "0.17"
tabled = "0.15"
