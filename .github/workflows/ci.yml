name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features testutils -- -D warnings

      - name: Run tests
        run: cargo test --all --features testutils

  profile-regression:
    name: Profile regression check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-profile-${{ hashFiles('**/Cargo.lock') }}

      - name: Profile on PR branch
        run: |
          cargo test -p defi-vault --features testutils -- test_time_lock_vault_profile --nocapture
          cp timelock_vault_profile.json candidate_profile.json
        continue-on-error: true

      - name: Checkout main for baseline
        run: |
          git stash
          git checkout origin/main
          cargo test -p defi-vault --features testutils -- test_time_lock_vault_profile --nocapture
          cp timelock_vault_profile.json baseline_profile.json
          git checkout -

      - name: Compare profiles
        run: |
          if [ -f baseline_profile.json ] && [ -f candidate_profile.json ]; then
            cargo run -p anvil-cli -- compare baseline_profile.json candidate_profile.json \
              --threshold 15 \
              --markdown regression_report.md
          fi
        continue-on-error: true

      - name: Post regression comment
        if: hashFiles('regression_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('regression_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
